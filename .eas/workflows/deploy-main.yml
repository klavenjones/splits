# Every push to main: check the code, then ship it.
#   - Native changes (new native dependency, plugin or app.json change): production iOS build,
#     submitted to TestFlight.
#   - JavaScript-only changes: an over-the-air update to the build that's already out.
# The fingerprint decides which. Put [eas skip] in a commit message to skip a run.
name: Deploy main

on:
  push:
    branches: ['main']
    paths:
      - '**'
      - '!docs/**'
      - '!supabase/**'
      - '!**/*.md'

jobs:
  checks:
    name: Typecheck, lint and test
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      # expo-env.d.ts is generated by `expo start` and gitignored, but tsc needs it (CSS imports).
      - name: Add Expo type references
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  fingerprint:
    name: Fingerprint
    needs: [checks]
    type: fingerprint
    environment: production

  get_ios_build:
    name: Check for an existing iOS build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production

  build_ios:
    name: Build iOS
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}

  publish_update:
    name: Publish update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    environment: production
    params:
      branch: production
      platform: ios
      upload_sentry_sourcemaps: true
